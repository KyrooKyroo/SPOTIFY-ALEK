name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Link website kamu"
        required: true
        default: "https://kyrokyroooo.github.io/Spotify-by-alex/"
      app_name:
        description: "Nama aplikasi"
        required: true
        default: "Alex Music"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Terima lisensi Android
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Buat project Android
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          mkdir app
          cd app
          npm init -y
          npm i @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @anuradev/capacitor-background-mode@8
          mkdir www
          echo '<!doctype html><title>Alex Music</title>' > www/index.html
          cat > capacitor.config.json <<EOF2
          {"appId":"com.alex.music","appName":"$APP_NAME","webDir":"www","server":{"url":"$APP_URL","cleartext":false,"androidScheme":"https"}}
          EOF2
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk alex-music.apk
          gh release create "apk-$RUN_NO" alex-music.apk \
            --repo "$REPO" \
            --title "APK $RUN_NO" \
            --notes "Unduh alex-music.apk lalu pasang di HP."
